<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme before first paint (no flash). Mirrors lib/theme.ts: dark unless "light", or "system" on a light OS. -->
    <script>
      try {
        var pref = localStorage.getItem("grip.theme");
        if (pref === "light" || (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <title>Grip - Get a grip. Code up.</title>
    <meta name="description" content="Navigate the job hunt with confidence, one skill at a time." />
    <meta property="og:title" content="Grip" />
    <meta property="og:description" content="Navigate the job hunt with confidence, one skill at a time." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#10131A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
